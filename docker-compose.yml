services:
  liftlab:
    build: .
    image: liftlab:latest
    ports:
      - "8080:80"
    restart: unless-stopped

  # Hot-reload development server: docker compose --profile dev up liftlab-dev
  liftlab-dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
